[project]
name = "prospect-agent"
version = "0.1.0"
description = "Agente que arma informes de prospectos antes de una reunión"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "anthropic>=2.12",

]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # lo necesita TestClient de FastAPI
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
#Las migraciones se generan automáticamente: no las reformateamos a mano
extend-exclude = ["alembic/versions"]

[tool.ruff.lint.per-file-ignores]
#conftest define variables de entorno antes de importar la app, por eso importa "tarde".
"tests/conftest.py" = ["E402"]

