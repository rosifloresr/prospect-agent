# Solo levanta PostgreSQL. Nuestro código corre en la compu para depurar fácil
services:
  db:
    image: postgres:16
    container_name: prospect-agent-db
    environment:
      # Credenciales SOLO para desarrollo local
      POSTGRES_USER: prospect
      POSTGRES_PASSWORD: prospect
      POSTGRES_DB: prospect_agent
    ports:
      # 127.0.0.1: la base queda accesible solo desde tu compu, no desde la red.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospect -d prospect_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: